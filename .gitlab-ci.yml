include:
  - template: Security/SAST.gitlab-ci.yml

image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - config
  - test
  - build

Test:
  stage: test
  script:
    - dotnet restore
    - dotnet test
  allow_failure: false
  only: branches

Build:
  stage: build
  script:
    - dotnet restore
    - dotnet build
  only: branches