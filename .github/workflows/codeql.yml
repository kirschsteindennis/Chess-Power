name: CodeQL

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    # Every Monday: new rules may find old problems
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Static Analysis (C#)
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # C# can be analysed without building the project
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"