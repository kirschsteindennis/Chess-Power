name: CI

on:
  push:
    branches: ["**"]
  pull_requests:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # "false": warnings are shown, but do not stop the build
  # "true": set true if warnings are gone
  WARNINGS_AS_ERRORS: "false"

jobs:
  build:
    name: Build (Windows, with WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore ChessPower.slnx

      - name: Build
        run: >
          dotnet build ChessPower.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=${{ env.WARNINGS_AS_ERRORS }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      # Installs the tools of .config/dotnet-tools.json
      - name: Restore Tools
        run: dotnet tool restore

      # Every project below tests/ is run
      # The loop continues after a failure, so that all test project report their results
      - name: Run Tests
        shell: bash
        run: |
          status=0
          for project in tests/*/*.csproj; do
            echo"::group::$project"
            dotnet test "$project" \
              --configuration Release \
              -p:ContinuousIntegrationBuild=true \
              --logger "trx;LogFileName=$(basename "$project" .csproj).trx" \
              --results-directory TestResults \
              --collect:"XPlat Code Coverage" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:CoverageReport -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            TestResults
            CoverageReport
          retention-days: 14


dependency-audit:
  name: Dependency Audit
  runs-on: ubuntu-latest
  # It only warns for now, because a new vulnerability can appear at any time
  continue-on-error: true
  steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props

    - name: Restore
      run: dotnet restore ChessPower.slnx -p:EnableWindowsTargeting=true

    - name: Look for vulnerable packages
      shell: bash
      run: |
        for project in src/*/*.csproj tests/*/*.csproj; do
          dotnet list "$project" package --vulnerable --include-transitive
        done | tee audit.txt
        if grep -q "has the following vulnerable packages" audit.txt; then
          echo "::warning::Vulnerable packages found, see the log"
          exit 1
        fi